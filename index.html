<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RJ WORLD BD - E-commerce & Reseller Marketplace</title>
    <meta name="description" content="RJ WORLD BD - Premier E-Commerce, Reselling & Multi-Vendor Marketplace in Bangladesh" />
    <meta name="theme-color" content="#0EA5E9" />
    <meta name="application-name" content="RJ World" />
    <meta name="apple-mobile-web-app-title" content="RJ World" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://rjworldbd.com/" />

    <!-- Search Engine Crawlers -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot-image" content="index, follow" />
    <meta name="google-site-verification" content="rjworldbd-google-search-console-verification" />

    <!-- Google Search Result Favicon (Square PNG, 48x48 & multiples of 48px as required by Google Search) -->
    <link rel="icon" type="image/png" sizes="48x48" href="https://rjworldbd.com/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="https://rjworldbd.com/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="https://rjworldbd.com/favicon-192x192.png" />
    <link rel="shortcut icon" type="image/png" href="https://rjworldbd.com/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://rjworldbd.com/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Search Engine & Social Identity -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rjworldbd.com/" />
    <meta property="og:site_name" content="RJ World" />
    <meta property="og:title" content="RJ WORLD BD - E-commerce & Reseller Marketplace" />
    <meta property="og:description" content="RJ WORLD BD - Premier E-Commerce, Reselling & Multi-Vendor Marketplace in Bangladesh" />
    <meta property="og:image" content="https://rjworldbd.com/og-image.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="RJ World Logo" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="RJ WORLD BD - E-commerce & Reseller Marketplace" />
    <meta name="twitter:description" content="RJ WORLD BD - Premier E-Commerce, Reselling & Multi-Vendor Marketplace in Bangladesh" />
    <meta name="twitter:image" content="https://rjworldbd.com/og-image.png" />

    <!-- Google Search Structured Data (JSON-LD) for Site Name, Logo & Search Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://rjworldbd.com/#website",
          "url": "https://rjworldbd.com/",
          "name": "RJ WORLD BD",
          "alternateName": [
            "RJ World",
            "RJ World BD",
            "rjworldbd.com"
          ],
          "description": "RJ WORLD BD - Premier E-Commerce, Reselling & Multi-Vendor Marketplace in Bangladesh",
          "publisher": {
            "@id": "https://rjworldbd.com/#organization"
          },
          "inLanguage": "en"
        },
        {
          "@type": "Organization",
          "@id": "https://rjworldbd.com/#organization",
          "name": "RJ WORLD BD",
          "alternateName": "RJ World",
          "url": "https://rjworldbd.com/",
          "logo": {
            "@type": "ImageObject",
            "@id": "https://rjworldbd.com/#logo",
            "url": "https://rjworldbd.com/rj-world-logo.png",
            "contentUrl": "https://rjworldbd.com/rj-world-logo.png",
            "caption": "RJ World Logo",
            "width": 800,
            "height": 800
          },
          "image": "https://rjworldbd.com/rj-world-logo.png",
          "description": "RJ WORLD BD - Premier E-Commerce, Reselling & Multi-Vendor Marketplace in Bangladesh"
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      window.addEventListener('error', function(e) {
        if (e.message === 'Script error.') {
          e.preventDefault();
          e.stopImmediatePropagation();
          console.warn('Ignored cross-origin script error');
          return true;
        }
      }, true);
      window.onerror = function(msg) {
        if (msg === 'Script error.') return true;
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
